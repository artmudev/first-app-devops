name: CD - Docker Hub

on:
  workflow_run:
    workflows: ['First CI']
    types:
      - completed

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build + Push FRONTEND
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/first-app-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/first-app-frontend:${{ github.sha }}

      # Build + Push BACKEND
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/first-app-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/first-app-backend:${{ github.sha }}