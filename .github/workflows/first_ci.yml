name: First CI

on:
    push:
        branches: ['dev']

jobs:
    setup:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test